<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Maniax Task Tracker</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --navy:#072E43;--blue:#064C73;--orange:#EF8B1E;--green:#8BC400;--red:#DA291C;
  --ink:#212529;--muted:#6b7785;--line:#e3e8ee;--bg:#f4f6f8;--card:#ffffff;
  --done:#D9EAD3;--blocked:#FCE5CD;--over:#F4CCCC;--soon:#FFF2CC;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Poppins,Arial,sans-serif;background:var(--bg);color:var(--ink);font-size:14px;min-height:100vh}
button{font-family:inherit;cursor:pointer}
input,select,textarea{font-family:inherit;font-size:15px}
.hidden{display:none!important}

/* PIN screen */
#pinScreen{min-height:100vh;display:flex;align-items:center;justify-content:center;background:linear-gradient(160deg,var(--navy) 0%,var(--blue) 100%);padding:20px}
.pinBox{background:#fff;border-radius:20px;padding:28px 24px;width:100%;max-width:340px;text-align:center;box-shadow:0 20px 50px rgba(0,0,0,.25)}
.brand{font-weight:800;letter-spacing:1px;color:var(--navy);font-size:20px}
.brand span{color:var(--orange)}
.sub{color:var(--muted);font-size:13px;margin-top:4px}
.dots{display:flex;gap:12px;justify-content:center;margin:22px 0}
.dot{width:14px;height:14px;border-radius:50%;border:2px solid var(--blue)}
.dot.on{background:var(--orange);border-color:var(--orange)}
.pad{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.pad button{height:58px;border-radius:14px;border:1px solid var(--line);background:#fff;font-size:22px;font-weight:600;color:var(--navy)}
.pad button:active{background:var(--bg)}
.pad .go{background:var(--orange);color:#fff;border-color:var(--orange);font-size:16px}
.pinErr{color:var(--red);font-size:13px;min-height:20px;margin-top:12px}

/* App */
header{background:var(--navy);color:#fff;padding:12px 16px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:20}
header .brand{color:#fff;font-size:16px}
.who{display:flex;align-items:center;gap:8px;font-size:12px}
.chip{background:rgba(255,255,255,.12);border-radius:20px;padding:4px 10px}
.chip b{color:var(--green)}
.out{background:transparent;border:1px solid rgba(255,255,255,.35);color:#fff;border-radius:20px;padding:4px 10px;font-size:12px}
nav{display:flex;gap:6px;padding:10px 12px;background:#fff;border-bottom:1px solid var(--line);overflow-x:auto;position:sticky;top:52px;z-index:19}
nav button{border:none;background:var(--bg);color:var(--navy);padding:9px 14px;border-radius:20px;font-weight:600;white-space:nowrap;font-size:13px}
nav button.active{background:var(--orange);color:#fff}
main{padding:14px;max-width:1100px;margin:0 auto}
.banner{background:var(--over);color:#7a1a12;border-radius:12px;padding:10px 14px;margin-bottom:12px;font-size:13px}
.loading{text-align:center;color:var(--muted);padding:30px}

.filters{display:grid;grid-template-columns:2fr 1fr 1fr 1fr 1fr;gap:8px;margin-bottom:12px}
.filters input,.filters select{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:#fff}
.count{color:var(--muted);font-size:12px;margin-bottom:8px}

.task{background:var(--card);border-radius:14px;padding:12px 14px;margin-bottom:10px;border-left:6px solid var(--blue);box-shadow:0 1px 3px rgba(0,0,0,.05);cursor:pointer}
.task.complete{background:var(--done);border-left-color:var(--green)}
.task.blocked{background:var(--blocked);border-left-color:var(--orange)}
.task.overdue{border-left-color:var(--red)}
.task .top{display:flex;justify-content:space-between;gap:8px;align-items:flex-start}
.task .id{font-weight:700;color:var(--blue);font-size:12px}
.task .txt{font-weight:500;margin-top:2px}
.meta{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.tag{font-size:11px;padding:3px 8px;border-radius:12px;background:var(--bg);color:var(--navy);font-weight:600}
.tag.high{background:#fde2df;color:var(--red)}
.tag.status{background:var(--navy);color:#fff}
.days{font-size:12px;font-weight:700;white-space:nowrap}
.days.over{color:var(--red)}.days.soon{color:var(--orange)}.days.ok{color:var(--muted)}

.tiles{display:grid;grid-template-columns:repeat(6,1fr);gap:10px;margin-bottom:16px}
.tile{background:#fff;border-radius:14px;padding:14px;text-align:center;box-shadow:0 1px 3px rgba(0,0,0,.05)}
.tile .n{font-size:26px;font-weight:800;color:var(--navy)}
.tile .l{font-size:11px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.5px}
.tile.red .n{color:var(--red)}.tile.orange .n{color:var(--orange)}.tile.green .n{color:var(--green)}
.panel{background:#fff;border-radius:14px;padding:14px;margin-bottom:14px;box-shadow:0 1px 3px rgba(0,0,0,.05);overflow-x:auto}
.panel h3{font-size:14px;color:var(--navy);margin-bottom:10px}
table{border-collapse:collapse;width:100%;font-size:13px}
th{background:var(--navy);color:#fff;text-align:left;padding:8px;font-weight:600;white-space:nowrap}
td{padding:8px;border-bottom:1px solid var(--line);vertical-align:top}
td.num{text-align:center;font-weight:600}

.form{background:#fff;border-radius:14px;padding:16px;box-shadow:0 1px 3px rgba(0,0,0,.05)}
.field{margin-bottom:12px}
.field label{display:block;font-size:12px;font-weight:600;color:var(--muted);margin-bottom:4px}
.field input,.field select,.field textarea{width:100%;padding:11px 12px;border:1px solid var(--line);border-radius:10px;background:#fff}
.field textarea{min-height:80px;resize:vertical}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.btn{border:none;border-radius:12px;padding:13px 18px;font-weight:700;font-size:15px}
.btn.primary{background:var(--orange);color:#fff}
.btn.ghost{background:var(--bg);color:var(--navy)}
.btn:disabled{opacity:.6}
.actions{display:flex;gap:10px;justify-content:flex-end;margin-top:6px}
.msg{font-size:13px;margin-top:10px;min-height:18px}
.msg.ok{color:#3d6b00}.msg.err{color:var(--red)}

.modalWrap{position:fixed;inset:0;background:rgba(7,46,67,.55);display:flex;align-items:flex-end;justify-content:center;z-index:50;padding:0}
.modal{background:#fff;width:100%;max-width:560px;max-height:92vh;overflow-y:auto;border-radius:20px 20px 0 0;padding:18px 16px}
.modal h2{font-size:16px;color:var(--navy);margin-bottom:12px}
.note{font-size:12px;color:var(--muted);margin-bottom:10px}

.logItem{padding:10px 0;border-bottom:1px solid var(--line)}
.logItem .t{font-size:11px;color:var(--muted)}
.logItem .a{font-weight:600;color:var(--navy)}
footer{text-align:center;color:var(--muted);font-size:11px;padding:20px 10px 30px}

@media (min-width:700px){.modalWrap{align-items:center}.modal{border-radius:20px}}
@media (max-width:820px){.tiles{grid-template-columns:repeat(3,1fr)}}
@media (max-width:640px){.filters{grid-template-columns:1fr 1fr}.filters .search{grid-column:1/3}.grid2{grid-template-columns:1fr}}
</style>
</head>
<body>

<!-- PIN screen -->
<div id="pinScreen">
  <div class="pinBox">
    <div class="brand">AIR <span>MANIAX</span></div>
    <div class="sub">Task Tracker. Enter your PIN</div>
    <div class="dots" id="dots"></div>
    <div class="pad" id="pad"></div>
    <div class="pinErr" id="pinErr"></div>
  </div>
</div>

<!-- App -->
<div id="app" class="hidden">
  <header>
    <div class="brand">AIR <span style="color:var(--orange)">MANIAX</span> <span style="font-weight:500;font-size:12px;color:#cfe0ea">Tasks</span></div>
    <div class="who"><span class="chip" id="whoChip"></span><button class="out" onclick="logout()">Log out</button></div>
  </header>
  <nav id="nav"></nav>
  <main>
    <div id="banner" class="banner hidden"></div>
    <section id="view-tasks"></section>
    <section id="view-dash" class="hidden"></section>
    <section id="view-add" class="hidden"></section>
    <section id="view-log" class="hidden"></section>
    <section id="view-users" class="hidden"></section>
  </main>
  <footer>Maniax Task Tracker v1.0 . View Emirates Sports Club LLC</footer>
</div>

<div id="modal" class="modalWrap hidden" onclick="if(event.target===this)closeModal()"><div class="modal" id="modalBody"></div></div>

<script>
var GAS_URL = 'https://script.google.com/macros/s/AKfycbwZqEViHExMqBdM7ehhdt8K1X_EembdekgPrHowHoEwzbLZn3Uo4pMISZcSZsgfzup0Bg/exec';
var VERSION = '1.0';
var PIN_LEN_MAX = 6;

var S = { pin: '', user: null, lists: null, tasks: [], view: 'tasks', filters: { q: '', status: 'Open', owner: '', park: '', priority: '' }, users: [] };
var entry = '';

// ---------- API ----------
function api(payload) {
  payload.pin = payload.pin || S.pin;
  var delays = [0, 1500, 3000];
  function attempt(i) {
    return new Promise(function (res) { setTimeout(res, delays[i]); }).then(function () {
      return fetch(GAS_URL, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify(payload) });
    }).then(function (r) { return r.json(); }).catch(function (err) {
      if (i < delays.length - 1) return attempt(i + 1);
      throw new Error('Could not reach the server. Check your connection and try again.');
    });
  }
  return attempt(0);
}

function esc(s) { return String(s == null ? '' : s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;'); }
function showBanner(t) { var b = document.getElementById('banner'); if (!t) { b.classList.add('hidden'); return; } b.textContent = t; b.classList.remove('hidden'); }
function fmtDate(s) {
  if (!/^\d{4}-\d{2}-\d{2}$/.test(s || '')) return s || '';
  var m = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  var p = s.split('-'); return Number(p[2]) + ' ' + m[Number(p[1]) - 1] + ' ' + p[0];
}

// ---------- PIN ----------
function buildPad() {
  var keys = ['1','2','3','4','5','6','7','8','9','C','0','GO'];
  var pad = document.getElementById('pad');
  pad.innerHTML = keys.map(function (k) {
    return '<button class="' + (k === 'GO' ? 'go' : '') + '" onclick="padKey(\'' + k + '\')">' + (k === 'C' ? '&#9003;' : k) + '</button>';
  }).join('');
  drawDots();
}
function drawDots() {
  var n = Math.max(4, entry.length);
  var h = '';
  for (var i = 0; i < n; i++) h += '<div class="dot' + (i < entry.length ? ' on' : '') + '"></div>';
  document.getElementById('dots').innerHTML = h;
}
function padKey(k) {
  document.getElementById('pinErr').textContent = '';
  if (k === 'C') { entry = entry.slice(0, -1); drawDots(); return; }
  if (k === 'GO') { if (entry.length >= 4) doLogin(); return; }
  if (entry.length < PIN_LEN_MAX) { entry += k; drawDots(); }
}
document.addEventListener('keydown', function (e) {
  if (document.getElementById('pinScreen').classList.contains('hidden')) return;
  if (/^\d$/.test(e.key)) padKey(e.key);
  else if (e.key === 'Backspace') padKey('C');
  else if (e.key === 'Enter') padKey('GO');
});
function doLogin() {
  var err = document.getElementById('pinErr');
  err.textContent = 'Checking...';
  api({ action: 'login', pin: entry }).then(function (r) {
    if (!r.ok) { err.textContent = r.error || 'Invalid PIN'; entry = ''; drawDots(); return; }
    S.pin = entry; S.user = r.user; S.lists = r.lists; entry = '';
    try { sessionStorage.setItem('mx_pin', S.pin); } catch (e) {}
    document.getElementById('pinScreen').classList.add('hidden');
    document.getElementById('app').classList.remove('hidden');
    document.getElementById('whoChip').innerHTML = esc(S.user.name) + ' . <b>' + esc(S.user.role) + '</b>' + (S.user.park !== 'All' ? ' . ' + esc(S.user.park) : '');
    buildNav(); loadTasks();
  }).catch(function (e) { err.textContent = e.message; });
}
function logout() {
  S.pin = ''; S.user = null; entry = '';
  try { sessionStorage.removeItem('mx_pin'); } catch (e) {}
  document.getElementById('app').classList.add('hidden');
  document.getElementById('pinScreen').classList.remove('hidden');
  drawDots();
}

// ---------- Nav ----------
function buildNav() {
  var lvl = S.user.level;
  var items = [['tasks', 'Tasks'], ['dash', 'Dashboard']];
  if (lvl >= 2) items.push(['add', 'Add task'], ['log', 'Activity log']);
  if (lvl >= 4) items.push(['users', 'Users and PINs']);
  document.getElementById('nav').innerHTML = items.map(function (i) {
    return '<button data-v="' + i[0] + '" onclick="go(\'' + i[0] + '\')">' + i[1] + '</button>';
  }).join('');
  go('tasks');
}
function go(v) {
  S.view = v;
  ['tasks', 'dash', 'add', 'log', 'users'].forEach(function (x) { document.getElementById('view-' + x).classList.toggle('hidden', x !== v); });
  Array.prototype.forEach.call(document.querySelectorAll('nav button'), function (b) { b.classList.toggle('active', b.getAttribute('data-v') === v); });
  showBanner('');
  if (v === 'tasks') renderTasks();
  if (v === 'dash') renderDash();
  if (v === 'add') renderAdd();
  if (v === 'log') loadLog();
  if (v === 'users') loadUsers();
}

// ---------- Tasks ----------
function loadTasks() {
  document.getElementById('view-tasks').innerHTML = '<div class="loading">Loading tasks...</div>';
  return api({ action: 'getTasks' }).then(function (r) {
    if (!r.ok) { showBanner(r.error); return; }
    S.tasks = r.tasks;
    if (S.view === 'tasks') renderTasks();
    if (S.view === 'dash') renderDash();
  }).catch(function (e) { showBanner(e.message); document.getElementById('view-tasks').innerHTML = ''; });
}
function opts(list, sel, blank) {
  var h = blank !== undefined ? '<option value="">' + esc(blank) + '</option>' : '';
  return h + list.map(function (v) { return '<option' + (v === sel ? ' selected' : '') + '>' + esc(v) + '</option>'; }).join('');
}
function uniq(arr) { var o = []; arr.forEach(function (v) { if (v && o.indexOf(v) < 0) o.push(v); }); return o.sort(); }
function sortTasks(a, b) {
  var ac = a.status === 'Complete' ? 1 : 0, bc = b.status === 'Complete' ? 1 : 0;
  if (ac !== bc) return ac - bc;
  var ad = a.daysLeft === '' ? 99999 : a.daysLeft, bd = b.daysLeft === '' ? 99999 : b.daysLeft;
  if (ad !== bd) return ad - bd;
  return a.id < b.id ? -1 : 1;
}
function filtered() {
  var f = S.filters, q = f.q.toLowerCase();
  return S.tasks.filter(function (t) {
    if (f.status === 'Open' && t.status === 'Complete') return false;
    if (f.status === 'Overdue' && !(t.daysLeft !== '' && t.daysLeft < 0)) return false;
    if (f.status && ['Open', 'Overdue', 'All'].indexOf(f.status) < 0 && t.status !== f.status) return false;
    if (f.owner && t.owner !== f.owner) return false;
    if (f.park && t.park !== f.park) return false;
    if (f.priority && t.priority !== f.priority) return false;
    if (q && (t.id + ' ' + t.task + ' ' + t.notes + ' ' + t.owner + ' ' + t.park).toLowerCase().indexOf(q) < 0) return false;
    return true;
  }).sort(sortTasks);
}
function renderTasks() {
  var el = document.getElementById('view-tasks');
  var f = S.filters;
  var owners = uniq(S.tasks.map(function (t) { return t.owner; }));
  var parks = uniq(S.tasks.map(function (t) { return t.park; }));
  var statuses = ['Open', 'Overdue', 'All'].concat(S.lists.statuses);
  var list = filtered();
  el.innerHTML =
    '<div class="filters">' +
      '<input class="search" placeholder="Search tasks" value="' + esc(f.q) + '" oninput="S.filters.q=this.value;drawList()">' +
      '<select onchange="S.filters.status=this.value;drawList()">' + opts(statuses, f.status) + '</select>' +
      '<select onchange="S.filters.owner=this.value;drawList()">' + opts(owners, f.owner, 'All owners') + '</select>' +
      '<select onchange="S.filters.park=this.value;drawList()">' + opts(parks, f.park, 'All parks') + '</select>' +
      '<select onchange="S.filters.priority=this.value;drawList()">' + opts(S.lists.priorities, f.priority, 'All priorities') + '</select>' +
    '</div><div class="count" id="count"></div><div id="list"></div>';
  drawList();
}
function daysLabel(t) {
  if (t.status === 'Complete') return '<span class="days ok">Complete</span>';
  if (t.daysLeft === '') return '<span class="days ok">No due date</span>';
  if (t.daysLeft < 0) return '<span class="days over">' + Math.abs(t.daysLeft) + 'd overdue</span>';
  if (t.daysLeft === 0) return '<span class="days over">Due today</span>';
  if (t.daysLeft <= 2) return '<span class="days soon">' + t.daysLeft + 'd left</span>';
  return '<span class="days ok">' + t.daysLeft + 'd left</span>';
}
function drawList() {
  var list = filtered();
  document.getElementById('count').textContent = list.length + ' of ' + S.tasks.length + ' tasks';
  document.getElementById('list').innerHTML = list.length ? list.map(function (t) {
    var cls = t.status === 'Complete' ? 'complete' : t.status === 'Blocked' ? 'blocked' : (t.daysLeft !== '' && t.daysLeft < 0 ? 'overdue' : '');
    return '<div class="task ' + cls + '" onclick="openTask(\'' + esc(t.id) + '\')">' +
      '<div class="top"><div><div class="id">' + esc(t.id) + '</div><div class="txt">' + esc(t.task) + '</div></div>' + daysLabel(t) + '</div>' +
      '<div class="meta"><span class="tag status">' + esc(t.status) + '</span>' +
      '<span class="tag' + (t.priority === 'High' ? ' high' : '') + '">' + esc(t.priority || 'No priority') + '</span>' +
      '<span class="tag">' + esc(t.owner) + '</span>' +
      (t.park ? '<span class="tag">' + esc(t.park) + '</span>' : '') +
      (t.due ? '<span class="tag">Due ' + esc(fmtDate(t.due)) + '</span>' : '') + '</div>' +
      (t.status === 'Blocked' && t.notes ? '<div class="note" style="margin:8px 0 0">' + esc(t.notes) + '</div>' : '') +
    '</div>';
  }).join('') : '<div class="loading">No tasks match these filters</div>';
}

// ---------- Task modal ----------
function findTask(id) { for (var i = 0; i < S.tasks.length; i++) if (S.tasks[i].id === id) return S.tasks[i]; return null; }
function openTask(id) {
  var t = findTask(id); if (!t) return;
  var full = t.canEdit, st = t.canUpdateStatus;
  var lockPark = S.user.level === 2 && S.user.park !== 'All';
  var dis = function (ok) { return ok ? '' : ' disabled'; };
  var h = '<h2>' + esc(t.id) + '</h2>' +
    (!full ? '<div class="note">' + (st ? 'You can update the status and notes of this task.' : 'View only.') + '</div>' : '') +
    '<div class="field"><label>Task</label><textarea id="m_task"' + dis(full) + '>' + esc(t.task) + '</textarea></div>' +
    '<div class="grid2">' +
      '<div class="field"><label>Status</label><select id="m_status"' + dis(st) + '>' + opts(S.lists.statuses, t.status) + '</select></div>' +
      '<div class="field"><label>Priority</label><select id="m_priority"' + dis(full) + '>' + opts(S.lists.priorities, t.priority, 'None') + '</select></div>' +
      '<div class="field"><label>Owner</label><select id="m_owner"' + dis(full) + '>' + opts(uniq(S.lists.owners.concat([t.owner])), t.owner) + '</select></div>' +
      '<div class="field"><label>Park</label><select id="m_park"' + dis(full && !lockPark) + '>' + opts(uniq(S.lists.parks.concat([t.park])), t.park, 'None') + '</select></div>' +
      '<div class="field"><label>Category</label><select id="m_category"' + dis(full) + '>' + opts(uniq(S.lists.categories.concat([t.category])), t.category, 'None') + '</select></div>' +
      '<div class="field"><label>Due date</label><input type="date" id="m_due" value="' + esc(t.due) + '"' + dis(full) + '></div>' +
    '</div>' +
    '<div class="field"><label>Blocked reason / notes</label><textarea id="m_notes"' + dis(st) + '>' + esc(t.notes) + '</textarea></div>' +
    '<div class="note">Source ' + esc(t.source || 'n/a') + '. Raised ' + esc(fmtDate(t.raised)) + '</div>' +
    '<div class="actions"><button class="btn ghost" onclick="closeModal()">Close</button>' +
    (st ? '<button class="btn primary" id="m_save" onclick="saveTask(\'' + esc(t.id) + '\')">Save</button>' : '') + '</div>' +
    '<div class="msg" id="m_msg"></div>';
  document.getElementById('modalBody').innerHTML = h;
  document.getElementById('modal').classList.remove('hidden');
}
function closeModal() { document.getElementById('modal').classList.add('hidden'); }
function val(id) { var e = document.getElementById(id); return e ? e.value : ''; }
function saveTask(id) {
  var t = findTask(id);
  var fields = { status: val('m_status'), notes: val('m_notes') };
  if (t.canEdit) {
    fields.task = val('m_task'); fields.priority = val('m_priority'); fields.owner = val('m_owner');
    fields.category = val('m_category'); fields.due = val('m_due');
    if (!(S.user.level === 2 && S.user.park !== 'All')) fields.park = val('m_park');
  }
  if (fields.status === 'Blocked' && !fields.notes.trim()) { msg('m_msg', 'Add the blocked reason in notes first', false); return; }
  var b = document.getElementById('m_save'); b.disabled = true; b.textContent = 'Saving...';
  api({ action: 'updateTask', id: id, fields: fields }).then(function (r) {
    b.disabled = false; b.textContent = 'Save';
    if (!r.ok) { msg('m_msg', r.error, false); return; }
    closeModal(); loadTasks();
  }).catch(function (e) { b.disabled = false; b.textContent = 'Save'; msg('m_msg', e.message, false); });
}
function msg(id, t, ok) { var e = document.getElementById(id); if (!e) return; e.textContent = t; e.className = 'msg ' + (ok ? 'ok' : 'err'); }

// ---------- Dashboard ----------
function stats(list) {
  var s = { open: 0, overdue: 0, week: 0, high: 0, blocked: 0, done: 0 };
  list.forEach(function (t) {
    if (t.status === 'Complete') { s.done++; return; }
    s.open++;
    if (t.daysLeft !== '' && t.daysLeft < 0) s.overdue++;
    if (t.daysLeft !== '' && t.daysLeft >= 0 && t.daysLeft <= 7) s.week++;
    if (t.priority === 'High') s.high++;
    if (t.status === 'Blocked') s.blocked++;
  });
  return s;
}
function renderDash() {
  var el = document.getElementById('view-dash');
  var s = stats(S.tasks);
  var tile = function (n, l, c) { return '<div class="tile ' + (c || '') + '"><div class="n">' + n + '</div><div class="l">' + l + '</div></div>'; };
  var group = function (key, title) {
    var names = uniq(S.tasks.map(function (t) { return t[key] || 'None'; }));
    var rows = names.map(function (n) {
      var x = stats(S.tasks.filter(function (t) { return (t[key] || 'None') === n; }));
      return '<tr><td>' + esc(n) + '</td><td class="num">' + x.open + '</td><td class="num" style="color:var(--red)">' + x.overdue + '</td><td class="num">' + x.week + '</td><td class="num">' + x.high + '</td><td class="num">' + x.blocked + '</td><td class="num" style="background:var(--done)">' + x.done + '</td></tr>';
    }).join('');
    return '<div class="panel"><h3>' + title + '</h3><table><tr><th>' + (key === 'owner' ? 'Owner' : 'Park') + '</th><th>Open</th><th>Overdue</th><th>Due 7 days</th><th>High open</th><th>Blocked</th><th>Complete</th></tr>' + rows + '</table></div>';
  };
  el.innerHTML = '<div class="tiles">' + tile(s.open, 'Open') + tile(s.overdue, 'Overdue', 'red') + tile(s.week, 'Due in 7 days', 'orange') +
    tile(s.high, 'High open', 'red') + tile(s.blocked, 'Blocked', 'orange') + tile(s.done, 'Complete', 'green') + '</div>' +
    group('owner', 'By owner') + group('park', 'By park');
}

// ---------- Add ----------
function renderAdd() {
  var lockPark = S.user.level === 2 && S.user.park !== 'All';
  var today = new Date(); var d = new Date(today.getTime() + 7 * 86400000);
  var iso = d.getFullYear() + '-' + ('0' + (d.getMonth() + 1)).slice(-2) + '-' + ('0' + d.getDate()).slice(-2);
  document.getElementById('view-add').innerHTML = '<div class="form">' +
    '<div class="field"><label>Task</label><textarea id="a_task" placeholder="What needs to be done"></textarea></div>' +
    '<div class="grid2">' +
      '<div class="field"><label>Owner</label><select id="a_owner">' + opts(S.lists.owners, '', 'Pick owner') + '</select></div>' +
      '<div class="field"><label>Park</label><select id="a_park"' + (lockPark ? ' disabled' : '') + '>' + (lockPark ? opts([S.user.park], S.user.park) : opts(S.lists.parks, '', 'All parks / none')) + '</select></div>' +
      '<div class="field"><label>Category</label><select id="a_category">' + opts(S.lists.categories, '', 'None') + '</select></div>' +
      '<div class="field"><label>Priority</label><select id="a_priority">' + opts(S.lists.priorities, 'Medium') + '</select></div>' +
      '<div class="field"><label>Due date</label><input type="date" id="a_due" value="' + iso + '"></div>' +
      '<div class="field"><label>Source</label><input id="a_source" placeholder="Visit, audit, Jolt, meeting"></div>' +
    '</div>' +
    '<div class="field"><label>Notes</label><textarea id="a_notes"></textarea></div>' +
    '<div class="actions"><button class="btn primary" id="a_btn" onclick="addTask()">Add task</button></div>' +
    '<div class="msg" id="a_msg"></div></div>';
}
function addTask() {
  var t = { task: val('a_task'), owner: val('a_owner'), park: val('a_park'), category: val('a_category'), priority: val('a_priority'), due: val('a_due'), source: val('a_source'), notes: val('a_notes') };
  if (!t.task.trim()) { msg('a_msg', 'Describe the task', false); return; }
  if (!t.owner) { msg('a_msg', 'Pick an owner', false); return; }
  var b = document.getElementById('a_btn'); b.disabled = true; b.textContent = 'Adding...';
  api({ action: 'addTask', task: t }).then(function (r) {
    b.disabled = false; b.textContent = 'Add task';
    if (!r.ok) { msg('a_msg', r.error, false); return; }
    renderAdd(); msg('a_msg', 'Task ' + r.id + ' added. The owner has been emailed if an email is on file.', true);
    loadTasks();
  }).catch(function (e) { b.disabled = false; b.textContent = 'Add task'; msg('a_msg', e.message, false); });
}

// ---------- Log ----------
function loadLog() {
  var el = document.getElementById('view-log');
  el.innerHTML = '<div class="loading">Loading activity...</div>';
  api({ action: 'getLog' }).then(function (r) {
    if (!r.ok) { showBanner(r.error); el.innerHTML = ''; return; }
    el.innerHTML = '<div class="panel">' + (r.log.length ? r.log.map(function (l) {
      return '<div class="logItem"><div class="t">' + esc(l.time) + ' . ' + esc(l.user) + (l.role ? ' (' + esc(l.role) + ')' : '') + (l.park ? ' . ' + esc(l.park) : '') + '</div>' +
        '<div><span class="a">' + esc(l.action) + '</span>' + (l.id ? ' ' + esc(l.id) : '') + '</div>' + (l.details ? '<div class="note" style="margin:2px 0 0">' + esc(l.details) + '</div>' : '') + '</div>';
    }).join('') : '<div class="loading">No activity yet</div>') + '</div>';
  }).catch(function (e) { showBanner(e.message); el.innerHTML = ''; });
}

// ---------- Users ----------
function loadUsers() {
  var el = document.getElementById('view-users');
  el.innerHTML = '<div class="loading">Loading users...</div>';
  api({ action: 'getUsers' }).then(function (r) {
    if (!r.ok) { showBanner(r.error); el.innerHTML = ''; return; }
    S.users = r.users;
    el.innerHTML = '<div class="panel"><h3>Users and PINs (C-level only)</h3>' +
      '<div class="note">Junior sees and updates own tasks. Manager adds and edits tasks for their park and views the activity log. Ops HOD sees and edits everything. C-level adds user and PIN control.</div>' +
      '<table><tr><th>Name</th><th>Role</th><th>Park</th><th>Email</th><th>PIN</th><th>Active</th><th></th></tr>' +
      S.users.map(function (u, i) {
        return '<tr' + (u.active ? '' : ' style="opacity:.5"') + '><td>' + esc(u.name) + '</td><td>' + esc(u.role) + '</td><td>' + esc(u.park) + '</td><td>' + esc(u.email || 'Missing') + '</td><td>' + esc(u.pin) + '</td><td>' + (u.active ? 'Yes' : 'No') + '</td>' +
          '<td><button class="btn ghost" style="padding:6px 10px;font-size:12px" onclick="editUser(' + i + ')">Edit</button></td></tr>';
      }).join('') + '</table><div class="actions" style="margin-top:12px"><button class="btn primary" onclick="editUser(-1)">Add user</button></div></div>';
  }).catch(function (e) { showBanner(e.message); el.innerHTML = ''; });
}
function editUser(i) {
  var u = i > -1 ? S.users[i] : { row: 0, name: '', role: 'Junior', park: 'All', email: '', pin: '', active: true };
  document.getElementById('modalBody').innerHTML = '<h2>' + (i > -1 ? 'Edit user' : 'Add user') + '</h2>' +
    '<div class="grid2">' +
      '<div class="field"><label>Name</label><input id="u_name" value="' + esc(u.name) + '"></div>' +
      '<div class="field"><label>Role</label><select id="u_role">' + opts(S.lists.roles, u.role) + '</select></div>' +
      '<div class="field"><label>Park</label><select id="u_park">' + opts(['All'].concat(S.lists.parks), u.park) + '</select></div>' +
      '<div class="field"><label>Email</label><input id="u_email" type="email" value="' + esc(u.email) + '"></div>' +
      '<div class="field"><label>PIN (4 to 6 digits)</label><input id="u_pin" inputmode="numeric" maxlength="6" value="' + esc(u.pin) + '"></div>' +
      '<div class="field"><label>Active</label><select id="u_active">' + opts(['Yes', 'No'], u.active ? 'Yes' : 'No') + '</select></div>' +
    '</div>' +
    '<div class="actions"><button class="btn ghost" onclick="closeModal()">Cancel</button><button class="btn primary" id="u_btn" onclick="saveUser(' + u.row + ')">Save</button></div>' +
    '<div class="msg" id="u_msg"></div>';
  document.getElementById('modal').classList.remove('hidden');
}
function saveUser(row) {
  var t = { row: row, name: val('u_name'), role: val('u_role'), park: val('u_park'), email: val('u_email'), pin: val('u_pin').trim(), active: val('u_active') === 'Yes' };
  var b = document.getElementById('u_btn'); b.disabled = true; b.textContent = 'Saving...';
  api({ action: 'saveUser', target: t }).then(function (r) {
    b.disabled = false; b.textContent = 'Save';
    if (!r.ok) { msg('u_msg', r.error, false); return; }
    closeModal(); loadUsers();
    api({ action: 'login' }).then(function (x) { if (x.ok) S.lists = x.lists; });
  }).catch(function (e) { b.disabled = false; b.textContent = 'Save'; msg('u_msg', e.message, false); });
}

// ---------- Start ----------
buildPad();
try {
  var saved = sessionStorage.getItem('mx_pin');
  if (saved) { entry = saved; doLogin(); }
} catch (e) {}
</script>
</body>
